name: mindmapai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  go_router: ^17.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8



dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.11.0


flutter_icons:
  android: true
  ios: true

  image_path: "assets/icon/icon.png"

  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_background: "#F8F7F5"



flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700

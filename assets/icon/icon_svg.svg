<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- Glow -->
    <circle cx="40" cy="40" r="30" fill="url(#logoGlow)" />

    <!-- Main connections -->
    <path d="M40 40 L40 20" stroke="#6366F1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M40 40 L20 40" stroke="#6366F1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M40 40 L60 40" stroke="#6366F1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M40 40 L40 60" stroke="#6366F1" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Secondary branches -->
    <path d="M40 20 L30 12" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M40 20 L50 12" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M20 40 L12 32" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M20 40 L12 48" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M60 40 L68 32" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M60 40 L68 48" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M40 60 L30 68" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M40 60 L50 68" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Nodes -->
    <circle cx="40" cy="20" r="4" fill="#818CF8" opacity="0.8"/>
    <circle cx="20" cy="40" r="4" fill="#818CF8" opacity="0.8"/>
    <circle cx="60" cy="40" r="4" fill="#818CF8" opacity="0.8"/>
    <circle cx="40" cy="60" r="4" fill="#818CF8" opacity="0.8"/>

    <circle cx="30" cy="12" r="3" fill="#A5B4FC" opacity="0.7"/>
    <circle cx="50" cy="12" r="3" fill="#A5B4FC" opacity="0.7"/>
    <circle cx="12" cy="32" r="3" fill="#A5B4FC" opacity="0.7"/>
    <circle cx="12" cy="48" r="3" fill="#A5B4FC" opacity="0.7"/>
    <circle cx="68" cy="32" r="3" fill="#A5B4FC" opacity="0.7"/>
    <circle cx="68" cy="48" r="3" fill="#A5B4FC" opacity="0.7"/>
    <circle cx="30" cy="68" r="3" fill="#A5B4FC" opacity="0.7"/>
    <circle cx="50" cy="68" r="3" fill="#A5B4FC" opacity="0.7"/>

    <!-- Center node -->
    <circle cx="40" cy="40" r="6" fill="#6366F1"/>
</svg>
